name: Deploy to GitHub Pages

# Deploys the pre-built unified dashboard to GitHub Pages.
# The dashboard is generated by `codeledger dashboard build` in the
# main codeledger-blackbox repo and committed as static HTML in deploy/.
# Same rendering pipeline as `codeledger insight serve` — one logic,
# multiple deployments.
#
# Live at: https://demo.codeledger.dev

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
