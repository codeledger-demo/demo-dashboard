name: Deploy to GitHub Pages

# Builds the dashboard as a static site (next export) and publishes
# to the `gh-pages` environment. The dashboard runs in fixture mode
# because there's no server runtime, so every page is deterministic
# and safe to serve from a CDN.
#
# Once this workflow has run at least once successfully AND the repo's
# Pages settings are configured to deploy from GitHub Actions, the
# dashboard will be live at:
#
#   https://codeledger-demo.github.io/demo-dashboard/
#
# Custom domain (e.g. demo.codeledger.dev) can be configured in the
# repo Settings → Pages → Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          # Repo name is the basePath when serving from github.io
          NEXT_PUBLIC_BASE_PATH: /demo-dashboard
        run: pnpm build

      - name: Add .nojekyll (prevent Jekyll processing)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
