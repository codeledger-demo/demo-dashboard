name: Deploy to GitHub Pages

# Builds the dashboard as a static site (next export) and publishes
# to the `gh-pages` environment. The dashboard runs in fixture mode
# because there's no server runtime, so every page is deterministic
# and safe to serve from a CDN.
#
# Live at: https://demo.codeledger.dev
#
# Triggers:
#   push (main)           — normal deploy on any commit
#   workflow_dispatch     — manual redeploy
#   repository_dispatch   — fired by codeledger-blackbox release-dispatch.yml
#                          after a new CLI release; bumps public/codeledger-version.json
#                          then deploys so the version badge stays current

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [codeledger-release]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── On release dispatch: bump the version file first, then fall through to build ──
  bump-version:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump codeledger-version.json
        id: bump
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          RELEASED_AT=$(date -u +"%Y-%m-%d")
          cat > public/codeledger-version.json <<EOF
{
  "version": "${VERSION}",
  "released_at": "${RELEASED_AT}",
  "release_url": "https://github.com/codeledgerECF/codeledger/releases/tag/v${VERSION}"
}
EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/codeledger-version.json
          git diff --cached --quiet && echo "No version change" && exit 0
          git commit -m "chore: bump CodeLedger version badge to v${VERSION}"
          git push

  build:
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull latest commit (may include version bump from bump-version job)
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SCENARIO_TRIGGER_URL: ${{ vars.SCENARIO_TRIGGER_URL || 'https://codeledger-scenario-trigger.ash-248.workers.dev' }}
        run: pnpm build

      - name: Add .nojekyll (prevent Jekyll processing)
        run: touch out/.nojekyll

      - name: Copy CNAME into build output
        run: cp public/CNAME out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
