name: Deploy to GitHub Pages

# Builds the dashboard as a static site (next export) and publishes
# to the `gh-pages` environment. The dashboard runs in fixture mode
# because there's no server runtime, so every page is deterministic
# and safe to serve from a CDN.
#
# Live at: https://demo.codeledger.dev

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          NEXT_PUBLIC_SCENARIO_TRIGGER_URL: ${{ vars.SCENARIO_TRIGGER_URL || 'https://codeledger-scenario-trigger.ash-248.workers.dev' }}
        run: pnpm build

      - name: Add .nojekyll (prevent Jekyll processing)
        run: touch out/.nojekyll

      - name: Copy CNAME into build output
        run: cp public/CNAME out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
