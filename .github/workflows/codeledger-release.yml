name: CodeLedger Release Sync

# Handles `codeledger-release` repository_dispatch events from
# codeledgerECF/codeledger-blackbox release-dispatch.yml.
#
# On each new CodeLedger release:
#   1. Updates public/codeledger-version.json with the new version
#   2. Commits and pushes to main
#   3. The push trigger in deploy-pages.yml fires automatically,
#      rebuilding and redeploying the dashboard at demo.codeledger.dev
#
# workflow_dispatch is also available for manual catch-up runs.

on:
  repository_dispatch:
    types: [codeledger-release]
  workflow_dispatch:
    inputs:
      version:
        description: "CodeLedger version to stamp (e.g. 0.10.32)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-version:
    name: Bump version badge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version || github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            echo "No version supplied — skipping"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating version badge to v${VERSION}"

      - name: Update codeledger-version.json
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          RELEASED_AT=$(date -u +"%Y-%m-%d")
          printf '{\n  "version": "%s",\n  "released_at": "%s",\n  "release_url": "https://github.com/codeledgerECF/codeledger/releases/tag/v%s"\n}\n' \
            "$VERSION" "$RELEASED_AT" "$VERSION" > public/codeledger-version.json
          cat public/codeledger-version.json

      - name: Commit and push
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/codeledger-version.json
          git diff --cached --quiet \
            && echo "Version already at v${VERSION} — no commit needed" \
            && exit 0
          git commit -m "chore: bump CodeLedger version badge to v${VERSION}"
          git push
          echo "Pushed — deploy-pages.yml will redeploy demo.codeledger.dev automatically"
